# What has to be true before code reaches production.
#
# Three checks, all of which run without a single secret — which is why this
# can run on every push and every pull request, including from a fork, and
# why a green tick here means something.
#
#   typecheck   the whole project, no emit
#   test        399 assertions plus a 4,000-input fuzz over the sanitizers
#   build       a real production build, the same command Vercel runs
#
# Deliberately NOT here: lint. The project has no ESLint config, and adding
# one now would produce hundreds of findings on untouched code — noise that
# teaches people to ignore a red tick. Worth doing later, on its own.
#
# The environment gate (npm run check:env) is also absent on purpose: CI has
# no real environment to check. It belongs in the Vercel build, where the
# actual variables are. See docs/DEPLOYMENT.md.

name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A new push supersedes the run before it — no point finishing a build for a
# commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Next inlines NEXT_PUBLIC_* at build time. These are placeholders so
          # the build is representative; nothing here reaches a deployment, and
          # no real secret is needed to compile the app.
          NEXT_PUBLIC_SITE_URL: https://socria.app
