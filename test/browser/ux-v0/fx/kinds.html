<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kinds</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#fbf8f3;color:#222}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;border-bottom:1px solid #eee}
nav a{margin-left:22px;color:#555;text-decoration:none;font-size:15px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:64px 40px}
.hero h1{font-size:52px;margin:0 0 12px;font-weight:400}
.hero img{width:100%;height:320px;object-fit:cover;display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px}
.card{padding:24px;border:1px solid #ddd;background:#fff}
.card h3{margin:0 0 6px}.card p{color:#555;font-size:14px;line-height:1.4;margin:0 0 14px}
.card button{padding:10px 16px;border:0;background:#5b3a24;color:#fff;font:inherit}
form{display:flex;gap:12px;padding:20px 40px 80px}input{padding:12px;border:1px solid #bbb;width:280px;font:inherit}
form button{padding:12px 18px;border:0;background:#222;color:#fff;font:inherit}
</style></head>
<body>
<header><strong>HALCYON</strong><nav><a href="#">Menu</a><a href="#">Visit</a><a href="#">Story</a></nav></header>
<section class="hero"><div><h1>Coffee for slow mornings</h1><p>Single-origin beans, roasted on Tuesdays.</p></div><img src="https://images.example.test/cafe-bar.jpg" alt="The espresso bar at first light"></section>
<section class="cards">
<div class="card"><h3>Roasted here</h3><p>Every Tuesday, in small batches, by the people who pour it.</p><button type="button">See the roast</button></div>
<div class="card"><h3>Pastries at seven</h3><p>From the bakery across the road, still warm.</p><button type="button">See the bakes</button></div>
<div class="card"><h3>Room to stay</h3><p>Long tables, quiet until ten, no rush.</p><button type="button">Book a table</button></div>
</section>
<form><label for="em" style="position:absolute;left:-9999px">Email</label><input id="em" placeholder="Your email"><button type="button">Join the list</button></form>
</body></html>
